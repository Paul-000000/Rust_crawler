[package]
name = "crawler"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.8"
colored = "3.1.1"
tokio = { version = "1.0", features = ["full"] } # Pour l'asynchrone
reqwest = { version = "0.12", features = ["rustls-tls"] } # Client HTTP
scraper = "0.27.0" # Pour parser le HTML proprement
url = "2.5" # Pour normaliser les URLs et extraire les domaines
